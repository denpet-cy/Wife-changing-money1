<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$WCM | Wife Changing Money</title>
    <style>
        :root {
            --bg-color: #0c0f12;
            --card-bg: #14191f;
            --accent-green: #90e052; /* De specifieke groen/limoen tint uit het screenshot */
            --accent-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #8492a6;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .glow-bg {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(144,224,82,0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .hero {
            text-align: left;
            padding: 6rem 5% 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-tag {
            color: var(--accent-green);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-tag::before {
            content: '●';
            font-size: 0.7rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent-green);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .btn-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent-green);
            color: #000;
            text-decoration: none;
            padding: 1rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sub-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        /* Contract Address Styling uit screenshot 1 */
        .contract-section {
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            margin-top: 3rem;
            max-width: 600px;
        }

        .contract-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }

        .contract-header a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .contract-header a:hover {
            color: var(--text-main);
        }

        .contract-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: transparent;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .address-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 1rem;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        /* Reward Book Dashboard uit screenshot 2 */
        .dashboard-section {
            border-top: 1px solid var(--border-color);
            padding: 6rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4rem;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .dashboard-title h2 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .dashboard-title p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .stat-large .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-large .value {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--accent-green);
            line-height: 1;
        }

        .stat-large .value span {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 0.5rem;
        }

        .stats-sub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        .stat-small .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-small .value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .footer-note {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .footer-note a {
            color: var(--accent-green);
            text-decoration: none;
        }

        /* Mascot footer styling */
        .mascot-container {
            text-align: center;
            padding: 4rem 1rem 0 1rem;
            position: relative;
        }

        .mascot-img {
            max-width: 220px;
            height: auto;
            margin-bottom: -10px; /* Laat de afbeelding visueel aansluiten op de footer */
        }

        footer {
            text-align: center;
            padding: 4rem 5%;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            max-width: 1200px;
            margin: 0 auto;
        }

        .disclaimer {
            font-size: 0.75rem;
            margin-top: 2rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.6;
            line-height: 1.5;
        }
    </style>
</head>

    <main>

            <div class="section-tag">The Hold-To-Earn Meme</div>
            <h1>Hold $WCM.<br><span>Get Zcash.</span></h1>
